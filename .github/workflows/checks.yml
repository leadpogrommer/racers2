name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  annotations:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m reccmp.tools.decomplint --target LEGORACERS2 --warnfail "LEGO Racers 2"

  # Build/accuracy checks require the hash-verified retail EXE and SP5 compiler.
  # They run locally through tools/build.py and tools/compare.py; no game assets
  # or upstream LR1 binary-download/publishing workflows are used by this CI.
